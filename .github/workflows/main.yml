name: Build Android APK

on:
  push:
    branches:
      - qml-main
  pull_request:
    branches:
      - qml-main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Android SDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT
        cd $ANDROID_SDK_ROOT
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d cmdline-tools-temp
        mkdir -p cmdline-tools/latest
        mv cmdline-tools-temp/* cmdline-tools/latest/
        yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Download Android NDK
      run: |
        mkdir -p $ANDROID_NDK_HOME
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
        unzip ndk.zip -d $ANDROID_NDK_HOME
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME/android-ndk-r25c" >> $GITHUB_ENV

    - name: Install Qt 6.8.2 (using aqt)
      run: |
        pip install aqtinstall
        aqt install-qt linux android android-33 6.8.2 --outputdir ${{ github.workspace }}/Qt
        echo "Qt installed to ${{ github.workspace }}/Qt"

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.8.2/android_armv7" \
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/Qt/6.8.2/android_armv7/lib/cmake/Qt6/qt.toolchain.cmake" \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-33 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: |
        cd build
        cmake --build . --parallel

    - name: Deploy APK
      run: |
        cd build
        androiddeployqt --input android-libappTypeDrill.so-deployment-settings.json \
                        --output apk \
                        --android-platform android-33 \
                        --jdk $JAVA_HOME \
                        --gradle

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TypeDrill-APK
        path: build/apk/*.apk
